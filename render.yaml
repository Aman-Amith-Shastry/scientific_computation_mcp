# Render Blueprint for the scientific_computation MCP server.
#
# Deploys the Dockerfile as a single web service on the free plan, which is what this
# server needs rather than merely what it can afford: tensors live in process memory
# between tool calls, so a second replica would split the store and break
# create_tensor -> view_tensor. Do not add numInstances.
#
# Render injects PORT and terminates TLS, so the container needs no extra configuration;
# src/main.py already reads $PORT and serves /health.
#
# Usage:
#     Render dashboard -> New -> Blueprint -> select this repo.
#     smithery mcp publish "https://<service>.onrender.com/mcp" \
#         -n @aman-amith-shastry/scientific_computation_mcp

services:
  - type: web
    name: scientific-computation-mcp
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # No maxShutdownDelaySeconds: free-tier services reject it, and the 30s default
    # cannot be raised. Sessions are dropped rather than drained on spin-down, which is
    # why the README treats a 15-minute idle gap as tensor loss.
