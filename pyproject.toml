[project]
name = "numpy-mcp"
version = "0.2.0"
description = "MCP server exposing NumPy/SymPy linear algebra, vector calculus, and plotting tools over streamable HTTP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.3",
    "numpy>=2.2.6",
    "sympy>=1.14.0",
    "pydantic>=2.0",
    "mcp>=1.13.1",
    "starlette>=0.47.0",
    "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
    "requests>=2.32.0",
]
